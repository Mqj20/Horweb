<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d18">
<title>HORWEB | البث المباشر</title><script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script><style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080d18;color:#fff;font-family:Tahoma,Arial,sans-serif;min-height:100vh}
header{padding:18px;background:#101a2b;border-bottom:1px solid #26344b;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:25px;font-weight:bold;color:#35c8ff;letter-spacing:1px}
.live{color:#ff4545;font-size:13px}
.container{max-width:1100px;margin:auto;padding:18px}
.player-box{background:#111b2b;padding:12px;border-radius:15px;border:1px solid #27364e}
video{width:100%;aspect-ratio:16/9;background:#000;border-radius:10px}
.now-playing{padding:14px 5px 5px;font-size:17px;font-weight:bold}
.status{color:#9aabc2;font-size:12px;margin-top:8px}
.section-title{margin:25px 0 15px;font-size:19px}
.channels{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
.channel{background:#111b2b;border:1px solid #27364e;border-radius:13px;padding:13px;text-align:center;cursor:pointer;transition:.2s}
.channel:hover{border-color:#35c8ff;transform:translateY(-3px)}
.channel.active{border:1px solid #35c8ff;background:#142b40}
.channel img{width:65px;height:65px;object-fit:contain;border-radius:10px;margin-bottom:10px}
.channel-name{font-size:13px;font-weight:bold}
.channel-number{color:#8da1ba;font-size:11px;margin-top:6px}
.notice{margin-top:20px;padding:13px;border-radius:10px;background:#182438;color:#b7c7dc;font-size:12px;line-height:1.8}
footer{text-align:center;padding:25px 10px;color:#72839b;font-size:12px}
@media(max-width:480px){header{padding:15px}.logo{font-size:21px}.container{padding:12px}.channels{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header>
    <div class="logo">HORWEB</div>
    <div class="live">● LIVE TV</div>
</header><main class="container"><div class="player-box">
    <video id="video" controls playsinline></video>
    <div class="now-playing" id="channelTitle">اختر قناة للمشاهدة</div>
    <div class="status" id="status">جاهز للتشغيل</div>
</div>

<h2 class="section-title">قنوات TOD beIN EVENTS</h2>
<div class="channels" id="channels"></div>

<div class="notice">
    <strong>معلومات التشغيل</strong><br>
    • القنوات تعمل عبر روابط M3U8 الأصلية.<br>
    • يتطلب التشغيل اتصالاً بالإنترنت.<br>
    • قد يمنع المتصفح تشغيل HTTP عند فتح الموقع عبر HTTPS.
</div>

</main><footer>HORWEB © 2026</footer><script>
const LOGO = "https://i.imgur.com/J9JKIxK.png";

const channels = [
    {name:"TOD beIN EVENTS 1",url:"http://8k.lol:80/live/19765982173986/15908418752697/887126.m3u8"},
    {name:"TOD beIN EVENTS 2",url:"http://8k.lol:80/live/19765982173986/15908418752697/887127.m3u8"},
    {name:"TOD beIN EVENTS 3",url:"http://8k.lol:80/live/19765982173986/15908418752697/887128.m3u8"},
    {name:"TOD beIN EVENTS 4",url:"http://8k.lol:80/live/19765982173986/15908418752697/887129.m3u8"},
    {name:"TOD beIN EVENTS 5",url:"http://8k.lol:80/live/19765982173986/15908418752697/887130.m3u8"},
    {name:"TOD beIN EVENTS 6",url:"http://8k.lol:80/live/19765982173986/15908418752697/887131.m3u8"},
    {name:"TOD beIN EVENTS 7",url:"http://8k.lol:80/live/19765982173986/15908418752697/887132.m3u8"},
    {name:"TOD beIN EVENTS 8",url:"http://8k.lol:80/live/19765982173986/15908418752697/887133.m3u8"},
    {name:"TOD beIN EVENTS 9",url:"http://8k.lol:80/live/19765982173986/15908418752697/887134.m3u8"}
];

const video = document.getElementById("video");
const statusText = document.getElementById("status");
const title = document.getElementById("channelTitle");
const channelsContainer = document.getElementById("channels");

let hls = null;

function playChannel(channel, element) {
    if(hls){
        hls.destroy();
        hls = null;
    }

    video.pause();
    video.removeAttribute("src");
    video.load();

    document.querySelectorAll(".channel").forEach(item=>{
        item.classList.remove("active");
    });

    element.classList.add("active");
    title.textContent = channel.name;
    statusText.textContent = "جارٍ الاتصال بخادم البث...";

    if(Hls.isSupported()){
        hls = new Hls({
            enableWorker:true,
            lowLatencyMode:true,
            maxBufferLength:30
        });

        hls.loadSource(channel.url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED,()=>{
            statusText.textContent = "البث جاهز";
            video.play().catch(()=>{
                statusText.textContent = "اضغط تشغيل لبدء المشاهدة";
            });
        });

        hls.on(Hls.Events.ERROR,(event,data)=>{
            if(data.fatal){
                statusText.textContent = "تعذر التشغيل. تحقق من الرابط أو اتصال الخادم.";
            }
        });

    }else if(video.canPlayType("application/vnd.apple.mpegurl")){
        video.src = channel.url;
        video.play().catch(()=>{
            statusText.textContent = "اضغط تشغيل لبدء المشاهدة";
        });
    }else{
        statusText.textContent = "المتصفح لا يدعم تشغيل HLS";
    }
}

channels.forEach((channel,index)=>{
    const card = document.createElement("div");
    card.className = "channel";

    card.innerHTML = `
        <img src="${LOGO}" alt="Channel Logo">
        <div class="channel-name">${channel.name}</div>
        <div class="channel-number">القناة ${index+1}</div>
    `;

    card.addEventListener("click",()=>{
        playChannel(channel,card);
    });

    channelsContainer.appendChild(card);
});
</script></body>
</html>
